name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: 3.1.9
  ANCHOR_VERSION: 1.0.2
  NODE_VERSION: 22

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  program:
    name: Program (build, Rust tests, property test, localnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked
      - name: Local deployer key
        run: |
          mkdir -p keys
          solana-keygen new --no-bip39-passphrase --silent -o keys/deployer.json
      - run: npm ci
      - run: npm run build --workspace sdk
      - name: Build (the program keypair is not in the repository)
        run: anchor build --ignore-keys
      - name: IDL in the SDK matches the build
        run: |
          node scripts/sync-idl.mjs
          git diff --exit-code -- sdk/src/idl supabase/functions/_shared
      - name: Rust tests and 2,000-case property test
        run: cargo test -p holdback
      - name: Localnet integration tests
        run: ./scripts/test-localnet.sh

  packages:
    name: Packages (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Webhook decoder tests
        working-directory: supabase/tests
        run: |
          npm ci
          npm run typecheck
          npm test

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build local packages the web app links to
        working-directory: .
        run: |
          npm ci
          npm run build --workspace sdk --workspace dojo
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  eval:
    name: Eval (unit tests, README numbers are current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: pip install -r eval/requirements.txt
      - run: python -m pytest eval -q
      - run: npm ci
      - name: Bench and README-table tests
        run: node --import tsx --test bench/test/*.test.ts
      - name: README table matches eval/results.json
        run: |
          npm run readme:numbers
          git diff --exit-code -- README.md

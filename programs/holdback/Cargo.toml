[package]
name = "holdback"
version = "0.1.0"
description = "HOLDBACK: every Solana payment gets an undo window enforced on-chain"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "holdback"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["token", "token_2022", "associated_token"] }
solana-instructions-sysvar = "3.0.0"
solana-sdk-ids = "3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = { version = "0.18.2", features = ["precompiles"] }
proptest = "1"
solana-account = "4.3"
solana-address = "2.7"
solana-clock = "3.2"
solana-instruction = "3.5"
solana-instruction-error = "2.5"
solana-keypair = "3.1"
solana-message = "4.2"
solana-signer = "3"
solana-transaction = "4.1"
solana-transaction-error = "3.4"

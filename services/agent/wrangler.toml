name = "holdback-guardian"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "holdback-api.prashantthakur.dev", custom_domain = true }]

# One trigger, every minute: release due holds, close settled ones, send
# pushes; on minutes divisible by ten it also re-assesses pending holds, and on
# minute 0 it refreshes the static blocklists (see jobsFor in src/cron.ts).
# Free plans cap Cron Triggers per account, so the jobs share one trigger.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# 30 metered calls per minute per caller IP (assess, reassess, flags, relay
# login, voice). See src/ratelimit.ts.
[[ratelimits]]
name = "ASSESS_LIMITER"
namespace_id = "41001"
simple = { limit = 30, period = 60 }

# Non-secret settings. Secrets go in with `wrangler secret put <NAME>`
# (see .dev.vars.example for the full list). SOLANA_RPC_URL is a secret and is
# required: Solana's public RPC endpoints refuse requests from Workers. Local
# `wrangler dev` reads it from .dev.vars.
[vars]
LLM_PROVIDER = "anthropic"
PUBLIC_BASE_URL = "https://holdback-api.prashantthakur.dev"
SNS_API_URL = "https://sdk-proxy-v2.sns.id"

# Optional: cache generated voice notes in R2 instead of Supabase Storage.
# Create the bucket with `wrangler r2 bucket create holdback-voice`, then
# uncomment.
# [[r2_buckets]]
# binding = "VOICE_BUCKET"
# bucket_name = "holdback-voice"

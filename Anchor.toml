[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
holdback = "BqNSjpGpePKj1hhD1o1UbyLdiYvSY4S3nt5jNe6Ny8vK"
holdback_payments = "HeJN7gDcFwxip6VGoWrniZ4Xb4DjoQNX6aNhLYmewFVw"

[programs.localnet]
holdback = "BqNSjpGpePKj1hhD1o1UbyLdiYvSY4S3nt5jNe6Ny8vK"
holdback_payments = "HeJN7gDcFwxip6VGoWrniZ4Xb4DjoQNX6aNhLYmewFVw"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "keys/holdback.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/holdback.ts"
test-payments = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/holdback-payments.ts"
test-compress-settlement = "npx ts-mocha -p ./tsconfig.json -t 120000 tests/compress-settlement.ts"
test-er = "npx ts-mocha -p ./tsconfig.json -t 120000 tests/er-devnet.ts"
test-payments-er = "npx ts-mocha -p ./tsconfig.json -t 120000 tests/payments-er-devnet.ts"
light = "light test-validator --stop && light test-validator --validator-args '--upgradeable-program BqNSjpGpePKj1hhD1o1UbyLdiYvSY4S3nt5jNe6Ny8vK target/deploy/holdback.so keys/holdback.json --upgradeable-program HeJN7gDcFwxip6VGoWrniZ4Xb4DjoQNX6aNhLYmewFVw target/deploy/holdback_payments.so keys/holdback.json'"
light-stop = "light test-validator --stop"
light-test-payments = "ANCHOR_PROVIDER_URL=http://127.0.0.1:8899 ANCHOR_WALLET=keys/holdback.json npx ts-mocha -p ./tsconfig.json -t 1000000 tests/holdback-payments.ts"
light-test-compress-settlement = "ANCHOR_PROVIDER_URL=http://127.0.0.1:8899 ANCHOR_WALLET=keys/holdback.json npx ts-mocha -p ./tsconfig.json -t 120000 tests/compress-settlement.ts"
light-test-local = "./scripts/test-local.sh"

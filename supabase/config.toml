# Supabase CLI configuration for HOLDBACK.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Layout:
#   migrations/   schema, row-level security, event ingestion, pg_cron jobs
#   seed.sql      rows a fresh project needs (no sample data)
#   functions/    Edge functions; `_shared/` holds the code they bundle
#   tests/        unit tests for the function's pure modules (Node, vitest)

project_id = "holdback"

[api]
enabled = true
port = 54321
# Only `public` is exposed. Row-level security decides what each role sees.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the hosted project (`show server_version;`).
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# The apps subscribe to changes on `holds` for countdowns and status.
enabled = true

[studio]
enabled = true
port = 54323

[auth]
# HOLDBACK has no Supabase Auth users. A wallet proves itself to the agent
# service, which signs a short-lived JWT carrying a `wallet` claim; the
# policies read that claim through `jwt_wallet()`. Sign-ups stay closed so
# nobody can obtain an `authenticated` token any other way.
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.helius-webhook]
enabled = true
# Helius cannot send a Supabase JWT. The function authenticates the caller
# itself, against HELIUS_WEBHOOK_SECRET in the Authorization header.
verify_jwt = false
# Entrypoint and imports use the defaults: functions/helius-webhook/index.ts
# and the deno.json next to it.
